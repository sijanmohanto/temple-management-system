<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cashGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>
  <g transform="translate(6, 12)">
    <!-- Back Note Shadow -->
    <rect x="10" y="4" width="72" height="42" rx="4" fill="#81C784" opacity="0.6" />
    <!-- Front Note -->
    <rect x="4" y="14" width="80" height="48" rx="5" fill="url(#cashGreen)" stroke="#1B5E20" stroke-width="2" />
    <rect x="8" y="18" width="72" height="40" rx="3" fill="none" stroke="#A5D6A7" stroke-width="1.5" stroke-dasharray="3,2" />
    <!-- Center Currency Circle -->
    <circle cx="44" cy="38" r="13" fill="#A5D6A7" opacity="0.25" />
    <circle cx="44" cy="38" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="44" y="44" font-family="'Noto Sans Bengali', sans-serif, Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">৳</text>
  </g>
</svg>
