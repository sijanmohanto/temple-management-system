<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>
  <g transform="translate(10, 12)">
    <!-- Roof Triangular Pediment -->
    <polygon points="40,4 2,24 78,24" fill="url(#bankBlue)" />
    <rect x="0" y="24" width="80" height="6" rx="1" fill="#0D47A1" />
    <!-- Classical Colonnade Pillars -->
    <rect x="8" y="32" width="10" height="34" rx="1.5" fill="url(#bankBlue)" />
    <rect x="25" y="32" width="10" height="34" rx="1.5" fill="url(#bankBlue)" />
    <rect x="45" y="32" width="10" height="34" rx="1.5" fill="url(#bankBlue)" />
    <rect x="62" y="32" width="10" height="34" rx="1.5" fill="url(#bankBlue)" />
    <!-- Pedestal Base -->
    <rect x="2" y="66" width="76" height="6" rx="1" fill="#0D47A1" />
    <rect x="0" y="72" width="80" height="6" rx="1" fill="url(#bankBlue)" />
  </g>
</svg>
