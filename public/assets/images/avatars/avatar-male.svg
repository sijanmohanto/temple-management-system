<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="maleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="kurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#maleBg)"/>
  <circle cx="64" cy="64" r="62.5" fill="none" stroke="#fed7aa" stroke-width="3"/>

  <!-- Torso / Kurta -->
  <path d="M26 128 C26 96 38 82 64 82 C90 82 102 96 102 128 Z" fill="url(#kurtaGrad)"/>
  <path d="M64 82 L64 128" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Kurta Collar -->
  <path d="M52 82 Q64 92 76 82 L72 74 Q64 80 56 74 Z" fill="#b91c1c"/>

  <!-- Neck -->
  <rect x="55" y="66" width="18" height="18" rx="4" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="41" cy="52" r="7" fill="url(#skinGrad)"/>
  <circle cx="87" cy="52" r="7" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="64" cy="51" rx="23" ry="26" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M41 46 C40 30 52 20 64 20 C76 20 88 30 87 46 C87 34 82 25 64 25 C46 25 41 34 41 46 Z" fill="#1e293b"/>
  <path d="M41 42 C41 30 49 22 64 22 C79 22 87 30 87 42 C84 31 77 25 64 25 C51 25 44 31 41 42 Z" fill="#0f172a"/>

  <!-- Tilak (Sandalwood & Vermilion Sacred Mark) -->
  <path d="M62 34 Q64 43 66 34 Z" fill="#dc2626"/>
  <circle cx="64" cy="45" r="1.5" fill="#eab308"/>

  <!-- Eyebrows -->
  <path d="M49 44 Q54 42 58 44" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M70 44 Q74 42 79 44" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="53" cy="48" r="2.2" fill="#0f172a"/>
  <circle cx="75" cy="48" r="2.2" fill="#0f172a"/>

  <!-- Nose -->
  <path d="M64 48 L63 56 L66 56" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smile -->
  <path d="M58 62 Q64 66 70 62" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
